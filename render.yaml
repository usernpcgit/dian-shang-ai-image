# 部署到 Render.com 免费版，得到一个「带代理的在线版」公网链接（AI 生图 + 竞品分析可直接用）
# 用法：
#   1. 把本目录推到你的 GitHub 仓库
#   2. 打开 https://dashboard.render.com → New → Blueprint → 选该仓库 → 部署
#   3. 部署时在 Render 控制台填入下方 ZHIPU_API_KEY（分析竞品用，与 model-eyes 同源）
#   4. 部署完得到一个 https://xxxx.onrender.com 的公网链接，打开 /tool 即用
services:
  - type: web
    name: self-ai-image
    runtime: python
    plan: free
    region: oregon
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: python3 proxy.py
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.13"
      # 竞品分析（智谱 GLM）用的 Key，云端必须在这里配置，否则分析会报「未配置 ZHIPU_API_KEY」
      - key: ZHIPU_API_KEY
        sync: false
      # 总钥匙（master key）即 ACCESS_SECRET 的值；设为 HZh660513 后，页面输入 HZh660513 即永久解锁。
      # 此值会随仓库提交；若想保持私密，可改为 sync:false 并在 Render 控制台手动设置。
      - key: ACCESS_SECRET
        value: "Hzh660513"
      # 授权证书（设备绑定）专用签名密钥。建议与 ACCESS_SECRET 不同；不填则默认等于 ACCESS_SECRET。
      # 用 gentoken 同款思路：去控制台手动填一个随机长字符串即可。
      - key: LICENSE_SECRET
        sync: false
      # 激活码「用过作废」持久化（强烈推荐）。不填则回退本地文件，Render 重启会清空导致记录丢失。
      # 去 https://upstash.com 建一个免费 Redis，复制 REST URL / Token 填到下面（控制台手动填）。
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false

