name: build-desktop

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install deps & build
        run: cd electron && npm install && npm run dist:mac
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mac-dmg
          path: electron/dist/*.dmg

  build-win:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install deps & build
        shell: bash
        run: cd electron && npm install && npm run dist:win
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: win-zip
          path: electron/dist/dianshang-ai-image-win-*.zip

  release:
    needs: [build-mac, build-win]
    runs-on: ubuntu-latest
    steps:
      - name: Download mac artifact
        uses: actions/download-artifact@v4
        with:
          name: mac-dmg
          path: artifacts/mac
      - name: Download win artifact
        uses: actions/download-artifact@v4
        with:
          name: win-zip
          path: artifacts/win
      - name: Remove existing release for tag (idempotent, 防同标签多草稿冲突)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          echo "cleaning any existing release for $TAG"
          RELS=$(curl -s -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/$GITHUB_REPOSITORY/releases?per_page=100")
          IDS=$(echo "$RELS" | /usr/bin/python3 -c "import sys,json; d=json.load(sys.stdin); print(' '.join(str(r['id']) for r in d if r.get('tag_name')=='$TAG'))" 2>/dev/null)
          for ID in $IDS; do
            echo "deleting release $ID"
            curl -s -X DELETE -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/$ID"
          done
          echo "cleanup done"
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "电商AI生图 ${{ github.ref_name }}（离线真买断版）"
          body: |
            桌面端离线真买断版：前端 + 本地代理全打包，买家自配 API Key，零服务端依赖。
            - Mac：dmg（拖入「应用程序」即可）
            - Windows：便携 zip（解压后双击 exe 即用）
            更新走应用内 GitHub 通道，已购版本永久可用。
          files: |
            artifacts/mac/*.dmg
            artifacts/win/*.zip
