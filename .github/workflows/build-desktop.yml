name: build-desktop

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-mac:
    # 用 ad-hoc 签名 + disable-library-validation 权限。
    # 之前 identity:null 仍被强制 ad-hoc 重签且缺权限 → 启动崩溃(SIGKILL,Team ID 不匹配)；
    # 去签名方案也被 macOS 拒绝(完全未签名进程不被允许)。
    # 正确做法：显式 identity:"-" + entitlements.mac.plist(com.apple.security.cs.disable-library-validation)，
    # 让 ad-hoc 签名的 app 能正常加载 Electron 框架（框架带 Apple Team ID，app 是 ad-hoc 无 Team ID）。
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install deps & build
        run: cd electron && npm install && npx electron-builder --mac --arm64
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mac-build
          path: electron/dist/*

  build-win:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install deps & build
        run: cd electron && npm install && npx electron-builder --win --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: win-build
          path: electron/dist/*
