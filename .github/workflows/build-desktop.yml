name: build-desktop

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

# 允许 electron-builder 将产物发布到 GitHub Releases
permissions:
  contents: write

jobs:
  build-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PyInstaller & requests
        run: pip install pyinstaller requests

      - name: Install deps & sync app files
        run: cd electron && npm install && npm run sync

      - name: Build proxy-bin (PyInstaller)
        run: cd electron && pyinstaller build-python/build.spec --distpath app/proxy-bin --workpath build-python/build --noconfirm

      - name: Build & publish dmg (unsigned)
        run: cd electron && npx electron-builder --mac --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - uses: actions/upload-artifact@v4
        with:
          name: mac-dmg
          path: electron/dist/*.dmg
          if-no-files-found: ignore

  build-win:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PyInstaller & requests
        run: pip install pyinstaller requests

      - name: Install deps & sync app files
        run: cd electron && npm install && npm run sync

      - name: Build proxy-bin (PyInstaller)
        run: cd electron && pyinstaller build-python/build.spec --distpath app/proxy-bin --workpath build-python/build --noconfirm

      - name: Build & publish exe (unsigned)
        run: cd electron && npx electron-builder --win --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - uses: actions/upload-artifact@v4
        with:
          name: win-exe
          path: electron/dist/*.exe
          if-no-files-found: ignore
