name: build-desktop

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Python (system python3 is primary path)
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps & sync app files
        run: cd electron && npm install && npm run sync

      # Mac 上不构建 proxy-bin：
      # PyInstaller 产物会被 XProtect 误判为"恶意软件"导致整个 app 被移到废纸篓。
      # Mac 系统都自带 python3，走 Python 路径即可（零原生二进制）。

      # ── 验证关键文件 ─────────────────────────────────────────────
      - name: Verify required files exist
        run: |
          echo "=== 检查 proxy.py ==="
          if [ ! -f "electron/app/proxy.py" ]; then
            echo "::error::proxy.py 不存在！sync 可能失败"
            exit 1
          fi
          echo "✅ proxy.py 存在 ($(wc -c < electron/app/proxy.py) bytes)"

          echo ""
          echo "=== 检查 standalone.html ==="
          if [ ! -f "electron/app/standalone.html" ]; then
            echo "::error::standalone.html 不存在！"
            exit 1
          fi
          echo "✅ standalone.html 存在"

          echo ""
          echo "=== 确认 proxy-bin 未被打包（避免 XProtect 误判）==="
          if [ -d "electron/app/proxy-bin" ]; then
            echo "⚠️ proxy-bin 目录存在，删除以避免打包进 app"
            rm -rf electron/app/proxy-bin
          else
            echo "✅ proxy-bin 不存在（Mac 用 Python 路径）"
          fi

      # ── 构建 Electron 应用 ────────────────────────────────────────
      - name: Build Electron app (dmg + zip)
        run: cd electron && npx electron-builder --mac --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      # ── 调试输出：确认产物位置 ────────────────────────────────────
      - name: "Debug list build output"
        run: |
          echo "=== electron/dist/ 内容 ==="
          ls -la electron/dist/ 2>/dev/null || echo "(不存在)"
          echo ""
          echo "=== 寻找所有 .app 文件 ==="
          find electron -name "*.app" -type d 2>/dev/null | head -10
          echo ""
          echo "=== 寻找所有 .dmg 文件 ==="
          find . -name "*.dmg" -not -path "*/node_modules/*" 2>/dev/null | head -10

      # ── 不做 ad-hoc 签名 ────────────────────────────────────────────
      # 重要：不要对 .app 做 codesign --deep --force --sign -
      # 原因：这会递归重签 .app 内所有二进制（包括 Electron Framework），
      #       覆盖掉 Apple 的原始签名 → XProtect 判定"签名被篡改"→ 恶意软件
      # 未签名 app 在 macOS 上只会触发 Gatekeeper（"无法验证开发者"），
      # 用户右键→打开 即可放行，不会被 XProtect 直接删除。
      - name: "Skip ad-hoc sign (preserve Apple signatures)"
        run: echo "⏭️ 跳过 ad-hoc 签名，保留 Electron 原始 Apple 签名"

      # ── 清除扩展属性 ──────────────────────────────────────────────
      - name: Strip extended attributes
        run: |
          APP=$(find electron/dist -maxdepth 3 -name "*.app" -type d 2>/dev/null | head -1)
          if [ -z "$APP" ]; then
            APP=$(find . -maxdepth 4 -name "*.app" -type d 2>/dev/null | head -1)
          fi
          if [ -n "$APP" ]; then
            xattr -cr "$APP" 2>/dev/null || true
            echo "✅ 属性已清除"
            echo "=== 验证 proxy.py 在 resources 中 ==="
            ls -lh "$APP/Contents/Resources/proxy.py" 2>/dev/null || echo "⚠️ proxy.py 不在 resources"
          else
            echo "⚠️ 未找到 .app，跳过属性清除"
          fi

      # ── 上传 Artifacts ────────────────────────────────────────────
      # 注意：electron-builder 已经按 package.json 的 mac target:["dmg","zip"]
      # 自动产出 .dmg 和 .zip 到 electron/dist/，无需手动 zip
      - uses: actions/upload-artifact@v4
        with:
          name: mac-dmg
          path: electron/dist/*.dmg
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        with:
          name: mac-zip
          path: electron/dist/*-mac.zip
          if-no-files-found: warn

  build-win:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PyInstaller & requests
        run: pip install pyinstaller requests

      - name: Install deps & sync app files
        run: cd electron && npm install && npm run sync

      # ── Windows 必须构建 proxy-bin（Win 用户可能没装 Python） ────
      - name: Build proxy-bin.exe (PyInstaller, required for Win)
        run: cd electron && pyinstaller build-python/build.spec --distpath app/proxy-bin --workpath build-python/build --noconfirm

      - name: Verify proxy-bin.exe exists
        shell: pwsh
        run: |
          $bin = "electron\app\proxy-bin\proxy-bin.exe"
          if (-not (Test-Path $bin)) {
            Write-Host "::error::proxy-bin.exe 未生成！"
            exit 1
          }
          $size = (Get-Item $bin).Length
          Write-Host "✅ proxy-bin.exe ($size bytes)"
          if ($size -lt 1000000) {
            Write-Host "::warning::proxy-bin.exe 异常小"
          }

      # ── 验证 proxy.py ──
      - name: Verify proxy.py exists
        shell: pwsh
        run: |
          if (-not (Test-Path "electron\app\proxy.py")) {
            Write-Host "::error::proxy.py 不存在！"
            exit 1
          }
          Write-Host "✅ proxy.py 存在"

      - name: Build & publish exe (unsigned)
        run: cd electron && npx electron-builder --win --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - uses: actions/upload-artifact@v4
        with:
          name: win-exe
          path: electron/dist/*.exe
          if-no-files-found: ignore
